<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อ - ณฐพงศ์ เฮงสว่าง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <div class="header-title">สมุดแนะนำตัวเอง</div>
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="about.html">เกี่ยวกับฉัน</a></li>
                    <li><a href="projects.html">ผลงาน</a></li>
                    <li><a href="contact.html" class="active">ติดต่อ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="contact">
            <h2 class="page-title">ช่องทางการติดต่อ</h2>
            <div class="contact-container">
                
                <!-- ส่วนที่ 1: แบบฟอร์มติดต่อจำลอง (อาจารย์กำหนดไว้ในเกณฑ์) -->
                <div class="contact-section">
                    <h3 style="margin-bottom: 1.5rem; color: var(--primary-color);">ส่งข้อความถึงผม</h3>
                    <form class="contact-form" action="#" method="post">
                        <div class="form-group">
                            <label for="name">ชื่อ-นามสกุล</label>
                            <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ" required>
                        </div>
                        <div class="form-group">
                            <label for="email">อีเมล</label>
                            <input type="email" id="email" name="email" placeholder="example@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="message">ข้อความ</label>
                            <textarea id="message" name="message" rows="4" placeholder="พิมพ์ข้อความที่ต้องการติดต่อ..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">ส่งข้อความ</button>
                    </form>
                </div>

                <!-- ส่วนที่ 2: ช่องทางโซเชียลมีเดีย -->
                <div class="contact-section" style="display: flex; flex-direction: column; justify-content: center;">
                    <h3>ข้อมูลการติดต่ออื่นๆ</h3>
                    <p style="margin-top: 1rem;">สามารถติดต่อผมได้ผ่านทางอีเมล โทรศัพท์ หรือดูผลงานเพิ่มเติมบน GitHub ได้เลยครับ</p>
                    <div class="social-icons">
                        <a href="mailto:694259007@webmail.npru.ac.th" title="Email"><i class="fa-solid fa-envelope"></i></a>
                        <a href="https://github.com/aofnatapong-007" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                        <a href="tel:0985313562" title="Phone"><i class="fa-solid fa-phone"></i></a>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Natapong Hengsawang. All rights reserved.</p>
    </footer>

</body>
</html>
